name: Bug report
description: Report a reproducible OpenLume problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: What happened, and which workflow were you using?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and file format
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true

