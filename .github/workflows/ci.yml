name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore OpenLume.slnx --locked-mode
      - run: dotnet build OpenLume.slnx --configuration Release --no-restore
      - run: dotnet test OpenLume.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
